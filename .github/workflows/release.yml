name: Release

# 打 v* 标签就出一个可以直接拖进 uTools 的 upx 包。
# 手动触发留着是为了重跑失败的发版，不用再动标签。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 和 ci.yml 一样只卡大版本：lockfile 是 pnpm 12 的格式，更细的版本没必要钉。
      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          # 这是跑工具链的 Node，不是插件运行时的 —— 插件跑在 uTools 内置的 Chromium
          # 里，拿哪个版本构建都不影响产物。而工具链这边 22.10 是硬下限：jsdom 30 依赖
          # 的 undici 8 用了 22.10 才有的 worker_threads.markAsUncloneable，Node 20 上
          # 所有 jsdom 环境的测试文件一加载就炸。
          node-version: '22'
          cache: pnpm

      # 排在构建前面：版本号对不上就没必要等那三分钟。
      #
      # 两个版本号必须是同一个。uTools 判断「有没有新版」只看 plugin.json，工具链看
      # package.json，漂移了不会有任何报错，只会表现成「发版了但用户收不到更新」。
      # build.sh 里没有这道检查（funotp 的有），所以放在这儿。
      - name: Check versions line up
        run: |
          version=$(node -p "require('./package.json').version")
          plugin=$(node -p "require('./utools/plugin.json').version")
          test "$plugin" = "$version" || {
            echo "error: plugin.json $plugin 与 package.json $version 不一致" >&2
            exit 1
          }
          # 标签只是个名字，和版本号对不上的话没人能从标签找回这包是哪一版。
          case "$GITHUB_REF" in
            refs/tags/v*)
              tag=${GITHUB_REF#refs/tags/v}
              test "$tag" = "$version" || {
                echo "error: 标签 v$tag 与 package.json 版本 $version 不一致" >&2
                exit 1
              }
              ;;
          esac

      # 发版这一趟不跳检查：这是最后一道关。
      - name: Build plugin
        run: ./build.sh

      # upx 就是个 zip：plugin.json 必须在压缩包根目录，所以要在 utools/ 里面打。
      #
      # 文件名的前缀是仓库名（utools-funlink）而不是插件名（funlink）：farfarfun/packages
      # 那边按 `<包名>-<版本>.upx` 认附件，而那边的包名一律等于仓库名。用
      # $GITHUB_REPOSITORY 算而不是抄一遍字面量 —— 仓库万一改名，附件名自己跟着改。
      - name: Pack upx
        run: |
          pkg=${GITHUB_REPOSITORY#*/}
          version=$(node -p "require('./package.json').version")
          cd utools
          zip -r -q "../$pkg-$version.upx" \
            plugin.json preload.js logo.png search.png dist
          cd ..
          unzip -l "$pkg-$version.upx"
          echo "PACKAGE=$pkg-$version.upx" >> "$GITHUB_ENV"

      # 校验和必须覆盖这次发布的全部附件，所以排在打包之后、建 release 之前。
      # farfarfun/packages 的站点按它给出那条校验和链接，约定见那边的
      # docs/package-spec.md 第 1.3 节。
      - name: Write SHA256SUMS
        run: |
          sha256sum "$PACKAGE" >SHA256SUMS
          cat SHA256SUMS

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF#refs/tags/}" "$PACKAGE" SHA256SUMS \
            --title "${GITHUB_REF#refs/tags/}" \
            --notes "安装：下载 $PACKAGE 后拖进 uTools 窗口。更新内容见 CHANGELOG.md。" \
            --verify-tag

      # 手动触发时没有标签，产物挂在这次运行上，方便先装上试一下再决定要不要发。
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: funlink-upx
          path: ${{ env.PACKAGE }}
          retention-days: 30
